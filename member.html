    // 获取URL参数
    function getUrlParameter(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    // 加载成员信息
    function loadMember() {
      const memberId = getUrlParameter('id');
      const member = members[memberId];

      if (!member) {
        document.getElementById('memberContent').innerHTML = `
          <div style="text-align: center; padding: 40px; color: var(--text-muted);">
            <p>未找到该成员信息</p>
            <a href="index.html" style="color: var(--primary); text-decoration: none; margin-top: 20px; display: inline-block;">返回首页</a>
          </div>
        `;
        return;
      }

      const tagsHtml = member.tags.map(tag => `<span class="tag">${tag}</span>`).join('');
      // 分离Email和其他链接
      const emailLink = member.links.find(link => link.text.includes('Email'));
      const otherLinks = member.links.filter(link => !link.text.includes('Email'));
      const emailHtml = emailLink ? `<p style="margin: 20px 0 0; color: var(--text-muted); font-size: 15px;"><strong style="color: var(--text);">邮箱：</strong><a href="${emailLink.url}" style="color: var(--primary); text-decoration: none;">${emailLink.url.replace('mailto:', '')}</a></p>` : '';
      const linksHtml = otherLinks.map(link => 
        `<a href="${link.url}" class="member-link" target="_blank">${link.text}</a>`
      ).join('');

      const publicationsHtml = member.publications && member.publications.length > 0 
        ? `<ul>${member.publications.map(pub => `<li>${pub}</li>`).join('')}</ul>`
        : '<p>暂无发表论文</p>';

      // 构建内容部分，只显示存在的字段
      let contentSections = '';
      
      if (member.bio) {
        contentSections += `
          <div class="content-section">
            <h3>个人简介</h3>
            <p>${member.bio}</p>
          </div>`;
      }
      
      if (member.education) {
        contentSections += `
          <div class="content-section">
            <h3>教育背景</h3>
            <p>${member.education}</p>
          </div>`;
      }
      
      if (member.publications && member.publications.length > 0) {
        contentSections += `
          <div class="content-section">
            <h3>发表论文</h3>
            ${publicationsHtml}
          </div>`;
      }

      document.getElementById('memberContent').innerHTML = `
        <img src="${member.photo}" alt="${member.name}" class="member-photo-large" 
             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23333%22 width=%22200%22 height=%22200%22/%3E%3Ctext fill=%22%23fff%22 x=%22100%22 y=%22100%22 text-anchor=%22middle%22 dy=%22.3em%22%3E${member.name}%3C/text%3E%3C/svg%3E'">
        <div class="member-info">
          <h1 class="member-name">${member.name}</h1>
          <p class="member-role">${member.role}</p>
          <div class="member-tags">${tagsHtml}</div>
          ${emailHtml}
          <div class="member-links" style="margin-top: 16px;">${linksHtml}</div>
        </div>
        <div class="member-content" style="grid-column: 1 / -1;">
          ${contentSections}
        </div>
      `;

      document.title = `${member.name} - 成员介绍 - PI Lab`;
    }

    // 初始化
    loadMember();

    // 移动端菜单切换
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    
    if (menuToggle && navLinks) {
      menuToggle.addEventListener('click', () => {
        menuToggle.classList.toggle('active');
        navLinks.classList.toggle('active');
      });
      
      // 点击导航链接后关闭菜单
      navLinks.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
          menuToggle.classList.remove('active');
          navLinks.classList.remove('active');
        });
      });
    }

    // 返回顶部按钮
    const backToTop = document.getElementById('backToTop');
    
    window.addEventListener('scroll', () => {
      if (window.pageYOffset > 300) {
        backToTop.classList.add('visible');
      } else {
        backToTop.classList.remove('visible');
      }
    });
    
    backToTop.addEventListener('click', () => {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    });
  </script>
